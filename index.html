<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>聚会桌游 · 联网版</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#171a36; --card:#1e2244; --card2:#262b55;
    --line:#333a6b; --txt:#eef0ff; --sub:#9aa0d0; --acc:#7c8cff; --acc2:#a06bff;
    --wolf:#ff6b6b; --good:#4dd4ac; --warn:#ffd166;
    --r:16px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{max-width:480px;margin:0 auto;padding:14px 14px calc(10px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .logo{font-size:17px;font-weight:800;display:flex;gap:6px;align-items:center;}
  .topbtn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:6px 10px;border-radius:10px;font-size:12px;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}
  h1{font-size:23px;margin:4px 0;}
  .sub{color:var(--sub);font-size:13px;line-height:1.5;margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);}
  .field{margin-bottom:12px;}
  .label{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;}
  input,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:15px;font-family:inherit;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:10px;font-size:12px;}
  .chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:700;}
  .stepper{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
  .stepper:last-child{border-bottom:none;}
  .stepper .rname{display:flex;align-items:center;gap:7px;font-size:14px;}
  .stepper .remoji{font-size:17px;}
  .step-ctrl{display:flex;align-items:center;gap:10px;}
  .step-ctrl button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:17px;font-weight:700;}
  .step-ctrl .num{min-width:20px;text-align:center;font-weight:700;}
  .total{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px;}
  .total b{font-size:18px;color:var(--acc);}
  .btn{display:block;width:100%;padding:14px;border-radius:13px;border:none;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:var(--shadow);cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt);}
  .btn.sm{width:auto;padding:10px 16px;font-size:14px;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .row{display:flex;gap:8px;}
  .row .btn{flex:1;}
  .pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px;}
  .pbtn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;position:relative;transition:.12s;}
  .pbtn:active{transform:scale(.97);}
  .pbtn.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;}
  .pbtn.dead{opacity:.4;}
  .pbtn .pid{font-size:11px;color:var(--sub);}
  .pbtn .pname{font-size:14px;font-weight:700;margin-top:2px;}
  .pbtn .pemoji{font-size:20px;margin-bottom:3px;}
  .pbtn .tag{position:absolute;top:4px;right:6px;font-size:10px;color:var(--warn);}
  .me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
  .me .av{font-size:26px;}
  .me .mt{font-size:12px;color:var(--sub);}
  .me .mn{font-size:16px;font-weight:800;}
  .me .badge{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:20px;}
  .b-wolf{background:rgba(255,107,107,.18);color:var(--wolf);border:1px solid var(--wolf);}
  .b-good{background:rgba(77,212,172,.16);color:var(--good);border:1px solid var(--good);}
  .prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.6;color:var(--sub);margin-bottom:10px;}
  .prompt b{color:var(--txt);}
  .title-c{text-align:center;margin:6px 0 10px;}
  .title-c .big{font-size:30px;}
  .nighttag{background:rgba(124,140,255,.15);color:var(--acc);border:1px solid var(--acc);}
  .daytag{background:rgba(255,209,102,.15);color:var(--warn);border:1px solid var(--warn);}
  .center{text-align:center;}
  .muted{color:var(--sub);font-size:13px;}
  .logwrap{margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:120px;overflow:auto;font-size:12px;color:var(--sub);line-height:1.6;}
  .rolesum{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .rolesum .ri{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;}
  .rolesum .ri .re{font-size:16px;}
  #chatPanel{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:6px;}
  #chatLog{max-height:120px;overflow:auto;font-size:13px;line-height:1.5;}
  #chatLog .cm{margin-bottom:3px;}
  #chatLog .cn{color:var(--acc);font-weight:700;}
  #chatInput{display:flex;gap:6px;}
  #chatInput input{border-radius:20px;padding:9px 12px;}
  #chatInput.disabled{opacity:.4;pointer-events:none;}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow);text-align:center;max-height:80vh;overflow:auto;}
  .modal .mt{font-size:17px;font-weight:800;margin-bottom:8px;}
  .modal .md{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:14px;text-align:left;}
  .codebig{font-size:34px;font-weight:900;letter-spacing:4px;color:var(--acc);text-align:center;margin:6px 0;}
  .players-c{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .pc{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px;}
  .modebar{display:flex;gap:8px;margin-bottom:6px;}
  .modebar .chip{flex:1;text-align:center;}
  .timerbar{margin:8px 0 2px;display:none;}
  .timerbar .tlabel{font-size:12px;color:var(--sub);margin-bottom:4px;text-align:center;}
  .timerbar .tbar{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;}
  .timerbar .tfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1s linear;}
  .rolecard .remoji{font-size:42px;margin-bottom:4px;}
  .rolecard .rteam{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;margin:6px 0;}
  .rolelist{display:flex;flex-direction:column;gap:8px;text-align:left;max-height:56vh;overflow:auto;}
  .rolelist .ri{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;line-height:1.55;}
  .rolelist .ri .rn{font-weight:800;font-size:14px;}
  .rolelist .ri .re{font-size:18px;margin-right:6px;}
  .godview .gv{text-align:left;}
  .godview .gv .ri{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;margin-bottom:5px;}
  .godview .gv .ri .gn{font-weight:700;flex:1;}
  .godview .gv .ri .gs{font-size:11px;color:var(--sub);}
  .godview .sum{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px;text-align:left;}
  .godview .gact{background:rgba(90,140,255,.10);border:1px dashed var(--acc);border-radius:10px;padding:10px;margin-top:10px;text-align:left;}
  .godview .gact .gt{font-weight:800;margin-bottom:6px;}
  .godview .gact .grow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .godview .gact .gbtn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;}
  .godview .gact .gbtn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .godview .gact .gmuted{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .lobbyfill{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .grow-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;}
  .grow-item input{width:auto;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span>🎲</span> 聚会桌游</div>
    <button class="topbtn" id="logBtn" onclick="openLog()" style="display:none">📜 日志</button>
    <button class="topbtn" id="judgeBtn" onclick="openGodView()" style="display:none">🔍 裁判总览</button>
  </header>

  <!-- HOME -->
  <section id="home" class="screen active">
    <h1>联网桌游</h1>
    <p class="sub">一人建房，其他人用自己手机输入房间号加入。每人只在自己手机上看身份、行动与发言。</p>
    <div class="card">
      <div class="field">
        <div class="label">你的昵称</div>
        <input id="homeName" placeholder="例如：小明" maxlength="12">
      </div>
      <div class="field">
        <div class="label"><span>选择模式</span></div>
        <div class="modebar" id="modebar"></div>
      </div>
      <div class="field">
        <div class="label">快速预设</div>
        <div class="presets" id="presets"></div>
      </div>
      <div class="field" id="cfgField">
        <div class="label" id="cfgLabel"><span>角色配置</span><span id="presetHint"></span></div>
        <div id="steppers"></div>
        <div id="botcSizes" class="presets" style="display:none"></div>
        <div id="botcSummary" class="muted" style="display:none;margin:6px 0;font-size:13px"></div>
      </div>
      <div class="total" id="totalWrap"><span>总人数</span><b id="totalCount">6</b></div>
      <label class="field" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);cursor:pointer">
        <input type="checkbox" id="noJudge" style="width:auto"> 无需法官（全员准备后自动开局，过半玩家确认即推进）
      </label>
      <button class="btn" onclick="createRoom()">创建房间 →</button>
      <button class="btn ghost" style="margin-top:8px" onclick="openRolesRef()">📖 角色说明</button>
    </div>
    <div class="card" style="margin-top:12px;">
      <div class="label">加入已有房间</div>
      <div class="row">
        <input id="joinCode" placeholder="房间号" maxlength="4" inputmode="numeric" style="text-transform:none">
        <button class="btn sm" onclick="joinRoom()">加入</button>
      </div>
    </div>
    <p class="sub center" style="margin-top:12px">Demo 版 · 一名玩家兼任"法官"负责开始投票与主持</p>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="me" id="meBar"></div>
    <div class="timerbar" id="phaseTimer"></div>
    <div id="stage"></div>
    <div id="chatPanel">
      <div id="chatLog"></div>
      <div id="chatInput">
        <input id="chatText" placeholder="发言…" maxlength="200" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn sm" onclick="sendChat()">发送</button>
      </div>
    </div>
  </section>
</div>

<div class="modal-mask" id="logModal">
  <div class="modal">
    <div class="mt" style="text-align:center">游戏日志</div>
    <div class="logwrap" id="logContent" style="max-height:50vh"></div>
    <button class="btn" style="margin-top:12px" onclick="document.getElementById('logModal').classList.remove('show')">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="modal-mask" id="bombModal">
  <div class="modal">
    <div class="mt" style="text-align:center">💣 引爆</div>
    <div class="md">选择要同归于尽的目标（引爆后你与目标同时出局；若目标是杀手方，则只有你出局）。本局仅一次。</div>
    <div id="bombTargets" class="pgrid"></div>
    <button class="btn ghost" style="margin-top:12px" onclick="document.getElementById('bombModal').classList.remove('show')">取消</button>
  </div>
</div>

<!-- 角色卡（我的角色） -->
<div class="modal-mask" id="roleModal">
  <div class="modal rolecard">
    <div class="remoji" id="rcEmoji">🐺</div>
    <div class="mt" id="rcName" style="text-align:center">角色</div>
    <div style="text-align:center"><span class="rteam" id="rcTeam">阵营</span></div>
    <div class="md" id="rcDesc" style="text-align:left"></div>
    <button class="btn" style="margin-top:10px" onclick="document.getElementById('roleModal').classList.remove('show')">知道了</button>
  </div>
</div>

<!-- 角色说明（全部角色速查） -->
<div class="modal-mask" id="rolesRefModal">
  <div class="modal">
    <div class="mt" style="text-align:center">📖 角色说明</div>
    <div class="rolelist" id="rolesRefList"></div>
    <button class="btn" style="margin-top:12px" onclick="document.getElementById('rolesRefModal').classList.remove('show')">关闭</button>
  </div>
</div>

<!-- 裁判总览（上帝视角） -->
<div class="modal-mask" id="godModal">
  <div class="modal godview">
    <div class="mt" style="text-align:center">🔍 裁判总览</div>
    <div class="gv" id="godList"></div>
    <div class="sum" id="godSum"></div>
    <div class="gact" id="godActions"></div>
    <button class="btn" style="margin-top:12px" onclick="document.getElementById('godModal').classList.remove('show')">关闭</button>
  </div>
</div>

<script>
const MODES = {
  werewolf: {
    label: '狼人杀',
    roles: {
      werewolf:{name:'狼人',emoji:'🐺',team:'wolf'},
      seer:{name:'预言家',emoji:'🔮',team:'good'},
      witch:{name:'女巫',emoji:'🧪',team:'good'},
      hunter:{name:'猎人',emoji:'🏹',team:'good'},
      guard:{name:'守卫',emoji:'🛡️',team:'good'},
      villager:{name:'平民',emoji:'👨',team:'good'},
    },
    roleOrder: ['werewolf','seer','witch','hunter','guard','villager'],
    presets: {
      '6人':{werewolf:2,seer:1,witch:1,hunter:0,guard:0,villager:2},
      '8人':{werewolf:2,seer:1,witch:1,hunter:1,guard:0,villager:3},
      '9人':{werewolf:3,seer:1,witch:1,hunter:1,guard:0,villager:3},
      '10人':{werewolf:3,seer:1,witch:1,hunter:1,guard:1,villager:3},
    },
  },
  killgame: {
    label: '杀人游戏',
    roles: {
      killer:{name:'杀手',emoji:'🔪',team:'wolf'},
      sniper:{name:'狙击手',emoji:'🎯',team:'wolf'},
      terrorist:{name:'恐怖分子',emoji:'💣',team:'wolf'},
      police:{name:'警察',emoji:'🚓',team:'good'},
      doctor:{name:'医生',emoji:'⚕️',team:'good'},
      butterfly:{name:'花蝴蝶',emoji:'🦋',team:'good'},
      oldman:{name:'森林老人',emoji:'🌲',team:'good'},
      civilian:{name:'平民',emoji:'🧑',team:'good'},
    },
    roleOrder: ['killer','sniper','terrorist','police','doctor','butterfly','oldman','civilian'],
    presets: {
      '8人':{killer:2,sniper:1,terrorist:1,police:1,doctor:1,butterfly:1,oldman:1,civilian:0},
      '10人':{killer:2,sniper:1,terrorist:1,police:2,doctor:1,butterfly:1,oldman:1,civilian:1},
      '12人':{killer:3,sniper:1,terrorist:1,police:2,doctor:1,butterfly:1,oldman:1,civilian:2},
    },
  },
  botc: {
    label: '血染钟楼',
    roles: {
      demon:{name:'恶魔',emoji:'💀',team:'wolf'},
      minion:{name:'爪牙',emoji:'🤝',team:'wolf'},
      fortune_teller:{name:'占卜师',emoji:'🔮',team:'good'},
      undertaker:{name:'送葬者',emoji:'⚰️',team:'good'},
      monk:{name:'僧侣',emoji:'🧘',team:'good'},
      ravenkeeper:{name:'守鸦人',emoji:'🦅',team:'good'},
      virgin:{name:'圣处女',emoji:'🕊️',team:'good'},
      chambermaid:{name:'女佣',emoji:'🛏️',team:'good'},
      empath:{name:'共情者',emoji:'💗',team:'good'},
      washerwoman:{name:'洗衣妇',emoji:'🧺',team:'good'},
      investigator:{name:'调查员',emoji:'🔍',team:'good'},
      saint:{name:'圣女',emoji:'👼',team:'good'},
      slayer:{name:'决斗者',emoji:'⚔️',team:'good'},
      soldier:{name:'士兵',emoji:'🛡️',team:'good'},
      mayor:{name:'市长',emoji:'🎩',team:'good'},
      chef:{name:'厨子',emoji:'🍳',team:'good'},
      librarian:{name:'图书管理员',emoji:'📚',team:'good'},
      drunk:{name:'酒鬼',emoji:'🍺',team:'good'},
      recluse:{name:'隐士',emoji:'🏠',team:'good'},
      butler:{name:'管家',emoji:'🤵',team:'good'},
    },
    roleOrder: ['demon','minion','fortune_teller','undertaker','monk','ravenkeeper','virgin','chambermaid','empath','washerwoman','investigator','saint','slayer','soldier','mayor','chef','librarian','drunk','recluse','butler'],
    presets: {},
    minPlayers: 5, minWolves: 1,
  },
};
let currentMode='werewolf';
let currentPreset='6人';
let ROLE_DEFS = MODES.werewolf.roles; // 进入游戏后会按 S.mode 更新
let me=null; // {code,playerId,isHost,name,mode}
let S=null; // latest view
let selTarget=null, selVote=null, selVoteDone=false, wHeal=false, wPoison=null, lastCtx='';
let _reconnecting=false, _firstMsgTimer=null, _sseErrors=0; // 断线自动重连状态
let selSheriff=null, roleCardShown=false; // 警长竞选选择 / 角色卡是否已自动弹过
let botcRoleConfig=null, botcSize=0; // 血染钟楼：按人数随机生成的角色配置
const BOTC_TOWNSFOLK=['fortune_teller','undertaker','monk','ravenkeeper','virgin','chambermaid','empath','washerwoman','investigator','saint','slayer','soldier','mayor','chef','librarian'];
const BOTC_OUTSIDERS=['drunk','recluse','butler'];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function botcGenRoles(k){
  const good=k-2, outsiderCount=Math.min(3,Math.max(1,Math.floor((k-5)/2)+1)), townCount=good-outsiderCount;
  const cfg={demon:1,minion:1};
  shuffle(BOTC_TOWNSFOLK.slice()).slice(0,townCount).forEach(r=>cfg[r]=(cfg[r]||0)+1);
  shuffle(BOTC_OUTSIDERS.slice()).slice(0,outsiderCount).forEach(r=>cfg[r]=(cfg[r]||0)+1);
  return cfg;
}

// 角色技能说明（新手速查）
const ROLE_DESC = {
  werewolf: {
    werewolf: '狼人阵营。每晚与狼队友一起刀人，需狼队达成一致。',
    seer: '好人阵营。每晚可查验一名玩家，得知其为狼人或好人。',
    witch: '好人阵营。拥有解药与毒药各一瓶：可救活被刀者，或毒杀一人（同一晚不能既救又毒）。',
    hunter: '好人阵营。被放逐或刀杀（非被毒）出局时，可开枪带走一名玩家。',

// ---------- setup UI ----------
function buildHome(){
  const mb=document.getElementById('modebar'); mb.innerHTML='';
  Object.keys(MODES).forEach(k=>{
    const b=document.createElement('div'); b.className='chip'+(k===currentMode?' on':''); b.textContent=MODES[k].label;
    b.onclick=()=>{currentMode=k;currentPreset=Object.keys(MODES[k].presets)[0];buildHome();}; mb.appendChild(b);
  });
  const pc=document.getElementById('presets'); pc.innerHTML='';
  Object.keys(MODES[currentMode].presets).forEach(k=>{
    const b=document.createElement('div'); b.className='chip'+(k===currentPreset?' on':''); b.textContent=k;
    b.onclick=()=>{currentPreset=k;applyPreset(k);}; pc.appendChild(b);
  });
  const sc=document.getElementById('steppers'); sc.innerHTML='';
  MODES[currentMode].roleOrder.forEach(r=>{
    const d=MODES[currentMode].roles[r];
    const row=document.createElement('div'); row.className='stepper';
    row.innerHTML=`<div class="rname"><span class="remoji">${d.emoji}</span><span>${d.name}</span></div>
      <div class="step-ctrl"><button onclick="step('${r}',-1)">−</button><span class="num" id="num_${r}">0</span><button onclick="step('${r}',1)">+</button></div>`;
    sc.appendChild(row);
  });
  // 血染钟楼：隐藏通用步进器，改用「选择人数」生成随机角色配置
  if(currentMode==='botc'){
    ['presets','steppers','totalWrap','cfgLabel'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
    document.getElementById('botcSizes').style.display='';
    document.getElementById('botcSummary').style.display='';
    renderBotcSizes();
  }else{
    applyPreset(currentPreset);
    ['presets','steppers','totalWrap','cfgLabel'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='';});
    document.getElementById('botcSizes').style.display='none';
    document.getElementById('botcSummary').style.display='none';
  }
}
function renderBotcSizes(){
  const wrap=document.getElementById('botcSizes'); wrap.innerHTML='';
  [5,6,7,8,9,10,11,12].forEach(k=>{
    const b=document.createElement('div'); b.className='chip'+(k===botcSize?' on':''); b.textContent=k+'人';
    b.onclick=()=>botcSelectSize(k); wrap.appendChild(b);
  });
  if(!botcSize) document.getElementById('botcSummary').textContent='选择人数后，将随机为你分配恶魔/爪牙与城镇角色（具体身份开局揭晓）。';
}
function botcSelectSize(k){
  botcSize=k; botcRoleConfig=botcGenRoles(k);
  const outs=Math.min(3,Math.max(1,Math.floor((k-5)/2)+1));
  document.getElementById('botcSummary').textContent=`已选 ${k} 人：将随机分配 1 恶魔 · 1 爪牙 · ${k-2} 名善良角色（其中约 ${outs} 名「局外人」）。具体身份开局揭晓。`;
  renderBotcSizes();
}
function applyPreset(k){const p=MODES[currentMode].presets[k];MODES[currentMode].roleOrder.forEach(r=>document.getElementById('num_'+r).textContent=p[r]||0);currentPreset=k;document.querySelectorAll('#presets .chip').forEach(c=>c.classList.toggle('on',c.textContent===k));document.getElementById('presetHint').textContent='';updateTotal();}
function step(r,d){const el=document.getElementById('num_'+r);let v=parseInt(el.textContent)+d;if(v<0)v=0;if(v>20)v=20;el.textContent=v;currentPreset=null;document.querySelectorAll('#presets .chip').forEach(c=>c.classList.remove('on'));document.getElementById('presetHint').textContent='自定义';updateTotal();}
function updateTotal(){let t=0;MODES[currentMode].roleOrder.forEach(r=>t+=parseInt(document.getElementById('num_'+r).textContent));document.getElementById('totalCount').textContent=t;}
function getRoles(){const o={};MODES[currentMode].roleOrder.forEach(r=>o[r]=parseInt(document.getElementById('num_'+r).textContent));return o;}

async function createRoom(){
  const name=(document.getElementById('homeName').value||'法官').trim();
  let roles;
  if(currentMode==='botc'){
    if(!botcRoleConfig){toast('请先选择血染钟楼人数');return;}
    roles=botcRoleConfig;
  }else{
    roles=getRoles();
  }
  let total=0;MODES[currentMode].roleOrder.forEach(r=>total+=roles[r]);
  if(total<MODES[currentMode].minPlayers){toast('至少需要 '+MODES[currentMode].minPlayers+' 人');return;}
  const wolves=MODES[currentMode].roleOrder.filter(r=>MODES[currentMode].roles[r].team==='wolf').reduce((s,r)=>s+roles[r],0);
  if(wolves<1){toast('至少 1 名杀手/狼人');return;}
  const noJudge=document.getElementById('noJudge').checked;
  const r=await post('/api/create',{name,roles,mode:currentMode,noJudge});
  if(!r.ok){toast(r.error||'创建失败');return;}
  me={code:r.code,playerId:r.playerId,isHost:true,name,mode:currentMode};
  saveMe();
  seedView(name,r.code,r.playerId,noJudge); // 立即渲染房间号，不等 SSE
  enterGame();
}
async function joinRoom(){
  const name=(document.getElementById('homeName').value||'玩家').trim();
  const code=(document.getElementById('joinCode').value||'').replace(/\D/g,'').trim();
  if(!code){toast('请输入房间号');return;}
  const r=await post('/api/join',{code,name});
  if(!r.ok){toast(r.error||'加入失败');return;}
  me={code:r.code,playerId:r.playerId,isHost:false,name:name,mode:currentMode};
  saveMe();
  seedView(name,r.code,r.playerId);
  enterGame();
}
// 创建/加入成功后立即构造一份最小视图，先渲染出房间号，SSE 到达后再被完整覆盖
function seedView(name,code,pid,noJudge){
  S={mode:currentMode,code,phase:'lobby',day:0,hostId:pid,noJudge:!!noJudge,
     you:{id:pid,name,role:null,team:null,alive:true,isWolf:false},
     players:[{id:pid,name,alive:true,role:null,isWolf:false}],
     myAction:null,night:null,lastDeaths:[],votesCount:0,aliveCount:1,
     silencedName:null,silencedId:null,terroristBombUsed:false,chat:[],log:[],result:null};
}
function enterGame(){
  document.getElementById('home').classList.remove('active');
  document.getElementById('game').classList.add('active');
  document.getElementById('logBtn').style.display='';
  connectSSE();
  render();
}
function connectSSE(){
  const es=new EventSource(`/api/events?code=${encodeURIComponent(me.code)}&player=${encodeURIComponent(me.playerId)}`);
  if(_reconnecting){ _firstMsgTimer=setTimeout(onRoomLost, 6000); } // 重连场景：6s 内没收到消息=房间已不存在
  es.onmessage=e=>{
    if(_firstMsgTimer){ clearTimeout(_firstMsgTimer); _firstMsgTimer=null; }
    _reconnecting=false;
    try{ S=JSON.parse(e.data); render(); }catch(_){}
  };
  es.onerror=()=>{
    if(_reconnecting){ _sseErrors++; if(_sseErrors>=3) onRoomLost(); } // 浏览器会自动重试；多次失败则放弃
  };
  window._es=es;
}
function onRoomLost(){
  if(window._es){ try{window._es.close();}catch(_){} window._es=null; }
  goHome();
}
function goHome(){
  if(window._es){ try{window._es.close();}catch(_){} window._es=null; }
  clearMe();
  _reconnecting=false;
  me=null; S=null; selTarget=null; selVote=null; selVoteDone=false; wHeal=false; wPoison=null; lastCtx=''; roleCardShown=false; selSheriff=null;
  document.getElementById('game').classList.remove('active');
  document.getElementById('home').classList.add('active');
  document.getElementById('logBtn').style.display='none';
}
function saveMe(){ if(me) try{ localStorage.setItem('pg_me', JSON.stringify(me)); }catch(_){} }
function clearMe(){ try{ localStorage.removeItem('pg_me'); }catch(_){} }
async function post(url,data){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const t=await r.text();try{return JSON.parse(t);}catch(e){return {ok:false,error:'服务器正在唤醒，请稍候再试'};}}catch(e){toast('网络错误');return {ok:false};}}
async function act(type,extra){const d=Object.assign({code:me.code,playerId:me.playerId,type},extra||{});const r=await post('/api/action',d);if(r&&r.error)toast(r.error);return r;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}

// ---------- render ----------
function render(){
  if(!S)return;
  ROLE_DEFS = MODES[S.mode].roles;
  const ctx=S.phase+'#'+S.day;
  if(ctx!==lastCtx){ selTarget=null; selVote=null; selVoteDone=false; wHeal=false; wPoison=null; lastCtx=ctx; }
  renderMe();
  // 首次进入游戏：自动弹出“我的角色”卡
  if(S.phase!=='lobby' && S.you.role && !roleCardShown){ roleCardShown=true; showRoleCard(); }
  const stage=document.getElementById('stage');
  if(S.phase==='lobby') stage.innerHTML=renderLobby();
  else if(S.phase==='night') stage.innerHTML=(S.mode==='botc')?renderNightBotc():(S.mode==='killgame')?renderNightKill():renderNightWolf();
  else if(S.phase==='sheriff') stage.innerHTML=renderSheriff();
  else if(S.phase==='day') stage.innerHTML=renderDay();
  else if(S.phase==='vote') stage.innerHTML=renderVote();
  else if(S.phase==='hunter') stage.innerHTML=renderHunter();
  else if(S.phase==='lastwords') stage.innerHTML=renderLastWords();
  else if(S.phase==='end') stage.innerHTML=renderEnd();
  const cp=document.getElementById('chatPanel');
  cp.style.display=(S.phase==='day'||S.phase==='vote'||S.phase==='hunter'||S.phase==='sheriff'||S.phase==='lastwords')?'flex':'none';
  // 被森林老人禁言则禁用发言
  const ci=document.getElementById('chatInput');
  ci.classList.toggle('disabled', !!(S.silencedId && S.you.id===S.silencedId));
  // 裁判总览按钮仅 host 可见
  document.getElementById('judgeBtn').style.display=(S.you.id===S.hostId)?'':'none';
  // 裁判总览打开时，随阶段实时刷新代操作面板
  const gmEl=document.getElementById('godModal');
  if(gmEl && gmEl.classList.contains('show') && S.godView) document.getElementById('godActions').innerHTML=renderGodActions();
  renderChat();
}
function renderMe(){
  const d=ROLE_DEFS[S.you.role];
  const emo = S.you.role? d.emoji : '❓';
  const rname = S.you.role? d.name : '未分配';
  const team = S.you.team==='wolf'?'b-wolf':'b-good';
  const teamTxt = S.you.team==='wolf'?(S.mode==='botc'?'恶魔阵营':(S.mode==='killgame'?'杀手阵营':'狼人阵营')):'好人阵营';
  document.getElementById('meBar').innerHTML=`
    <div class="av">${emo}</div>
    <div><div class="mt">${S.you.name} · 房间 ${S.code}</div><div class="mn">${rname}${S.you.alive?'':' · 已出局'}</div></div>
    <div class="badge ${team}">${teamTxt}</div>
    <button class="topbtn" style="margin-left:8px" onclick="showRoleCard()">我的角色</button>`;
}
function aliveList(){return S.players.filter(p=>p.alive);}
function pbtn(p,sel,onClick,disabled){
  const rd = ROLE_DEFS[p.role] || (currentMode==='botc'?MODES.botc.roles.demon:(currentMode==='killgame'?MODES.killgame.roles.civilian:MODES.werewolf.roles.villager));
  const sh = p.sheriff ? '<div class="tag" style="color:var(--warn)">🔰</div>' : '';
  return `<div class="pbtn ${sel?'sel':''} ${disabled?'dead':''}" ${onClick?`onclick="${onClick}"`:''}>
    <div class="pemoji">${rd.emoji}</div>
    <div class="pid">#${p.id}</div><div class="pname">${escapeHtml(p.name)}</div>${sh}</div>`;
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- 角色卡 / 角色说明 ----------
function showRoleCard(){
  if(!S||!S.you.role){ toast('身份尚未分配'); return; }
  const d=ROLE_DEFS[S.you.role];
  document.getElementById('rcEmoji').textContent=d.emoji;
  document.getElementById('rcName').textContent=d.name;
  const isWolf=S.you.team==='wolf';
  const teamTxt=isWolf?(S.mode==='botc'?'恶魔阵营':(S.mode==='killgame'?'杀手阵营':'狼人阵营')):'好人阵营';
  const tb=document.getElementById('rcTeam');
  tb.textContent=teamTxt; tb.className='rteam '+(isWolf?'b-wolf':'b-good');
  document.getElementById('rcDesc').textContent=(ROLE_DESC[S.mode]&&ROLE_DESC[S.mode][S.you.role])||'';
  document.getElementById('roleModal').classList.add('show');
}
function openRolesRef(){
  const mode=currentMode;
  const list=MODES[mode].roleOrder.map(r=>{
    const d=MODES[mode].roles[r];
    const desc=(ROLE_DESC[mode]&&ROLE_DESC[mode][r])||'';
    return `<div class="ri"><span class="re">${d.emoji}</span><div><div class="rn">${d.name} <span class="${d.team==='wolf'?'b-wolf':'b-good'}" style="font-size:11px">${d.team==='wolf'?'杀手/狼':'好人'}</span></div>${desc}</div></div>`;
  }).join('');
  document.getElementById('rolesRefList').innerHTML=list;
  document.getElementById('rolesRefModal').classList.add('show');
}

// ---------- 裁判总览（上帝视角） ----------
function openGodView(){
  if(!S||!S.godView){ toast('仅房主（法官）可查看'); return; }
  const g=S.godView;
  const gv=g.players.map(p=>{
    const rd=MODES[S.mode].roles[p.role]||{emoji:'❓',name:p.role||'?'};
    const teamCls=p.team==='wolf'?'b-wolf':'b-good';
    const st=p.alive?'存活':(p.connected?'离线':'出局');
    return `<div class="ri"><span class="re">${rd.emoji}</span><span class="gn">${escapeHtml(p.name)}</span><span class="${teamCls}">${rd.name}</span><span class="gs">${st}</span></div>`;
  }).join('');
  document.getElementById('godList').innerHTML=gv;
  let sum='';
  if(g.sheriff) sum+=`🔰 警长：${escapeHtml(g.sheriff)}<br>`;
  if(g.night){
    const n=g.night;
    const items=[];
    if(n.note) items.push(n.note);
    if(n.wolfTarget) items.push('狼刀→'+n.wolfTarget);
    if(n.killerTarget) items.push('杀手指杀→'+n.killerTarget);
    if(n.sniperTarget) items.push('狙击→'+n.sniperTarget);
    if(n.guardTarget) items.push('守卫→'+n.guardTarget);
    if(n.seer) items.push('预言家验'+n.seer);
    if(n.police) items.push('警察指认'+n.police);
    if(n.doctorTarget) items.push('医生救→'+n.doctorTarget);
    if(n.butterfly) items.push('花蝴蝶护体→'+n.butterfly);
    if(n.oldman) items.push('禁言→'+n.oldman);
    if(items.length) sum+='上一夜：'+items.join('；');
  }
  document.getElementById('godSum').innerHTML=sum||'（暂无夜晚行动记录）';
  document.getElementById('godActions').innerHTML=renderGodActions();
  document.getElementById('godModal').classList.add('show');
}

// 裁判上帝视角：法官代机器人操作（单人测试用）
const GOD_ROLE_OF_STEP = { wolf: 'werewolf' }; // 夜晚步骤名与角色 key 不完全一致
function godRoleOf(step){ return GOD_ROLE_OF_STEP[step] || step; }
function renderGodActions(){
  if(!S||!S.godView) return '';
  const g=S.godView, ph=S.phase;
  if(ph==='sheriff'){
    const alive=g.players.filter(p=>p.alive);
    const c=alive.map(x=>`<button class="gbtn" onclick="godSheriffAll('${x.id}')">${escapeHtml(x.name)}</button>`).join('');
    return `<div class="gt">🔰 代投票（竞选）</div><div class="grow">${c}</div><div class="gmuted">点候选人 = 让所有存活玩家投TA</div>`;
  }
  if(ph==='night'){
    if(S.mode==='botc'){
      const alive=g.players.filter(p=>p.alive);
      const boxes=alive.map(p=>`<label class="grow-item"><input type="checkbox" class="botc-death" value="${p.id}"> <span>${escapeHtml(p.name)}</span> <span class="${p.team==='wolf'?'b-wolf':'b-good'}">${MODES[S.mode].roles[p.role].name}</span></label>`).join('');
      return `<div class="gt">🌙 说书人结算本夜</div>
        <div class="grow" style="flex-direction:column;align-items:stretch">${boxes}</div>
        <button class="gbtn" style="margin-top:8px" onclick="godBotcNightEnd()">☀️ 结束夜晚（勾选=死亡）</button>
        <div class="gmuted">不勾选任何人 = 平安夜。由说书人根据角色技能手动决定死亡。</div>`;
    }
    const step=S.night.steps[S.night.step];
    const label=S.night.stepName||'';
    const actors=g.players.filter(p=>p.role===godRoleOf(step) && p.alive);
    if(!actors.length) return `<div class="gt">🌙 ${label}</div><div class="gmuted">无在场角色</div>`;
    let inner='';
    if(step==='witch'){
      const w=actors[0];
      inner=`<button class="gbtn" onclick="godWitch('${w.id}','heal')">💊 救（解药）</button>
             <button class="gbtn" onclick="godWitch('${w.id}','skip')">跳过</button>
             <span class="gmuted">毒→</span>`+g.players.filter(p=>p.alive).map(p=>`<button class="gbtn" onclick="godWitch('${w.id}','poison','${p.id}')">${escapeHtml(p.name)}</button>`).join('');
    } else {
      const isWolfStep=(step==='wolf'||step==='killer');
      let targets;
      if(step==='butterfly') targets=g.players.filter(p=>p.alive && p.id!==actors[0].id);
      else if(isWolfStep) targets=g.players.filter(p=>p.alive && p.team!=='wolf');
      else targets=g.players.filter(p=>p.alive);
      inner=`<div class="grow">${targets.map(t=>`<button class="gbtn" onclick="godNight('${step}','${t.id}')">${escapeHtml(t.name)}</button>`).join('')}</div>`;
    }
    return `<div class="gt">🌙 ${label} <span class="gmuted">(${actors.map(a=>a.name).join('/')})</span></div>${inner}<div class="grow" style="margin-top:8px"><button class="gbtn ghost" onclick="godSkip()">跳过此步</button></div>`;
  }
  if(ph==='vote'){
    const alive=g.players.filter(p=>p.alive);
    const c=alive.map(x=>`<button class="gbtn" onclick="godVoteAll('${x.id}')">${escapeHtml(x.name)}</button>`).join('');
    return `<div class="gt">🗳️ 代投票</div><div class="grow">${c}</div><div class="gmuted">点候选人 = 所有机器人+法官投TA</div><button class="gbtn ghost" style="margin-top:6px" onclick="godForceVote()">强制结算</button>`;
  }
  if(ph==='lastwords'){
    const sp=(S.lastWords&&S.lastWords.speakers)||[];
    return `<div class="gt">💬 遗言环节</div><div class="gmuted">出局者：${sp.map(s=>escapeHtml(s.name)).join('、')||'无'}</div><button class="gbtn" style="margin-top:6px" onclick="godEndLastWords()">结束遗言环节</button>`;
  }
  if(ph==='day'){
    return `<div class="gt">☀️ 白天</div><button class="gbtn" style="margin-top:6px" onclick="godStartVote()">开始投票</button>`;
  }
  if(ph==='hunter'){
    const h=g.players.find(p=>p.role==='hunter' && !p.alive);
    if(!h) return `<div class="gt">🏹 猎人开枪</div><div class="gmuted">等待猎人操作…</div>`;
    const tg=g.players.filter(p=>p.alive).map(p=>`<button class="gbtn" onclick="godHunterShoot('${h.id}','${p.id}')">${escapeHtml(p.name)}</button>`).join('');
    return `<div class="gt">🏹 猎人（机器人）开枪</div><div class="grow">${tg}</div><div class="gmuted">点目标 = 代猎人开枪</div>`;
  }
  return '';
}

function phaseTimerLabel(){const p=S&&S.phase;if(p==='night')return '🌙 夜晚行动';if(p==='day')return '☀️ 白天讨论';if(p==='vote')return '🗳️ 投票';if(p==='lastwords')return '💬 遗言';if(p==='sheriff')return '🔰 竞选警长';return '';}
function tickTimer(){
  const el=document.getElementById('phaseTimer');
  if(!el)return;
  if(S&&S.timer&&S.timer.endsAt){
    const left=Math.max(0,Math.round((S.timer.endsAt-Date.now())/1000));
    const total=S.timer.total||1;
    const pct=Math.max(0,Math.min(100,left/total*100));
    el.style.display='';
    el.innerHTML=`<div class="tlabel">${phaseTimerLabel()} · 剩余 ${left}s</div><div class="tbar"><div class="tfill" style="width:${pct}%"></div></div>`;
  } else { el.style.display='none'; }
}

  return `<div class="title-c"><span class="big">☀️</span><div>第 ${S.day} 天 · 天亮了</div></div>
    <div class="card"><div class="prompt">${dead}</div>${extra}${hostBtn}</div>
    <p class="center muted" style="margin-top:10px">大家开始发言讨论吧 👇</p>`;
}
async function startVote(){const r=await act('start_vote');}

// ---------- 法官：断线/挂机兜底控制 ----------
function hostNightSkipBtn(){
  if(S.noJudge) return '';
  if(S.you.id!==S.hostId) return '';
  return `<button class="btn ghost" style="margin-top:10px" onclick="hostSkip()">⏭️ 法官：跳过当前步骤</button>`;
}
function hostSkip(){act('host_skip');}
function hostForceVoteBtn(){
  if(S.noJudge) return `<button class="btn ghost" style="margin-top:10px" onclick="act('proceed')">✅ 继续（${S.proceedCount}/${S.proceedNeed} 已确认，过半即结算）</button>`;
  if(S.you.id!==S.hostId) return '';
  return `<button class="btn ghost" style="margin-top:10px" onclick="hostForceVote()">⏭️ 法官：结束投票并结算</button>`;
}
function hostForceVote(){act('host_force_vote');}

// ---------- vote ----------
function renderVote(){
  const alive=aliveList();
  const meAlive=S.you.alive;
  let body='';
  if(!meAlive){
    body=`<div class="prompt center">你已出局，等待其他玩家投票（${S.votesCount}/${S.aliveCount}）…</div>`;
  }else{
    if(selVoteDone){
      body=`<div class="prompt center">✅ 你已投票，等待其他玩家（${S.votesCount}/${S.aliveCount}）…</div>`;
    }else{
      body=`<div class="prompt"><b>🗳️ 投票放逐</b><br>选择你要投的玩家（不能投自己）。</div>
        <div class="pgrid">${alive.filter(p=>p.id!==S.you.id).map(t=>pbtn(t,selVote===t.id,`selVote=${t.id};render();`)).join('')}</div>
        <div class="foot" style="margin-top:10px">
          <button class="btn ghost sm" onclick="selVote=-1;doVote();">弃票</button>
          <button class="btn" ${selVote==null?'disabled':''} onclick="doVote()">确认投票</button>
        </div>`;
    }
  }
  // 恐怖分子在投票阶段也能引爆
  let bomb='';
  if(S.mode==='killgame' && S.you.role==='terrorist' && !S.terroristBombUsed && S.you.alive){
    bomb=`<button class="btn ghost" style="margin-top:10px" onclick="openBomb()">💣 引爆（与一人同归于尽）</button>`;
  }
  return `<div class="title-c"><span class="big">🗳️</span><div>第 ${S.day} 天 · 投票</div></div>${body}${bomb}${hostForceVoteBtn()}`;
}
function doVote(){ if(selVote===undefined)return; selVoteDone=true; act('vote',{target:selVote}); }

// ---------- hunter (werewolf only) ----------
function renderHunter(){
  if(S.hunt && S.hunt.waiting){
    return `<div class="title-c"><span class="big">🏹</span><div>猎人开枪</div></div>
      <div class="prompt center">等待猎人开枪…</div>`;
  }
  if(S.hunt && S.hunt.targets){
    return `<div class="title-c"><span class="big">🏹</span><div>你是猎人，可以开枪</div></div>
      <div class="prompt"><b>🏹 猎人开枪</b><br>选择要带走的玩家。</div>
      <div class="pgrid">${S.hunt.targets.map(t=>pbtn(t,selTarget===t.id,`selTarget=${t.id};render();`)).join('')}</div>
      <div class="foot" style="margin-top:10px">
        <button class="btn ghost sm" onclick="selTarget=null;act('hunter_shoot',{target:null});">不开枪</button>
        <button class="btn" ${selTarget==null?'disabled':''} onclick="act('hunter_shoot',{target:selTarget});selTarget=null;">开枪</button>
      </div>`;
  }
  return `<div class="prompt center">处理猎人…</div>`;
}

// ---------- end ----------
function openBomb(){
  const box=document.getElementById('bombTargets');
  box.innerHTML=aliveList().filter(p=>p.id!==S.you.id).map(p=>`<div class="pbtn" onclick="act('terrorist_bomb',{target:'${p.id}'});document.getElementById('bombModal').classList.remove('show');"><div class="pemoji">${ROLE_DEFS[p.role?p.role:'civilian'].emoji}</div><div class="pname">${escapeHtml(p.name)}</div></div>`).join('');
  document.getElementById('bombModal').classList.add('show');
}
function renderEnd(){
  const win=S.result==='good'?(S.mode==='botc'?'🎉 善良阵营胜利！':'🎉 好人阵营胜利！'):(S.mode==='botc'?'👿 恶魔阵营胜利！':(S.mode==='killgame'?'🔪 杀手阵营胜利！':'🐺 狼人阵营胜利！'));
  const cls=S.result==='good'?'b-good':'b-wolf';
  const rs=S.players.map(p=>{const d=ROLE_DEFS[p.role];return `<div class="ri"><span class="re">${d.emoji}</span><span style="flex:1">${escapeHtml(p.name)}</span><span class="${p.team==='wolf'?'b-wolf':'b-good'}">${d.name}</span><span class="muted">${p.alive?'存活':'出局'}</span></div>`;}).join('');
  return `<div class="title-c"><div class="codebig" style="font-size:26px;color:${S.result==='good'?'var(--good)':'var(--wolf)'}">${win}</div></div>
    <div class="card"><div class="rolesum">${rs}</div></div>
    <div class="foot" style="margin-top:12px"><button class="btn" onclick="goHome()">返回首页</button></div>`;
}

// ---------- chat ----------
function renderChat(){
  const box=document.getElementById('chatLog');
  if(!S||!S.chat)return;
  box.innerHTML=S.chat.map(c=>`<div class="cm"><span class="cn">${escapeHtml(c.name)}：</span>${escapeHtml(c.text)}</div>`).join('');
  box.scrollTop=box.scrollHeight;
}
async function sendChat(){const t=document.getElementById('chatText').value.trim();if(!t)return;document.getElementById('chatText').value='';await act('chat',{text:t});}

// ---------- log ----------
function   openLog(){const c=document.getElementById('logContent');c.innerHTML=(S&&S.log)?S.log.slice().reverse().map(m=>`<div class="lm">[第${m.day}轮] ${escapeHtml(m.msg)}</div>`).join(''):'暂无';document.getElementById('logModal').classList.add('show');}

buildHome();
setInterval(tickTimer, 1000); // 阶段倒计时每秒刷新
// 刷新/重开页面后：若本地留有未结束的房间身份，直接回到原座位（断线重连）
try{
  const saved=localStorage.getItem('pg_me');
  if(saved){ const m=JSON.parse(saved); if(m&&m.code&&m.playerId){ me=m; if(m.mode) currentMode=m.mode; _reconnecting=true; enterGame(); } }
}catch(_){}
</script>
</body>
</html>
